---
- name: Détruire l'infrastructure de l'examen

  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - vars/aws.yml
  module_defaults:
    group/amazon.aws.aws:
      region: "{{ aws_region }}"

  tasks:
    # Filtre par tag : on ne touche QU'À ce qui appartient à l'examen
    - name: Terminer les instances du projet et attendre la fin
      amazon.aws.ec2_instance:
        state: absent
        filters:
          "tag:Project": "{{ project_tag }}"
          instance-state-name: [pending, running, stopping, stopped]
        wait: true

    - name: Trouver le VPC par défaut
      amazon.aws.ec2_vpc_net_info:
        filters:
          is-default: "true"
      register: default_vpc

    # Possible seulement maintenant que plus aucune instance ne l'utilise
    - name: Supprimer le security group
      amazon.aws.ec2_security_group:
        name: "{{ sg_name }}"
        vpc_id: "{{ default_vpc.vpcs[0].id }}"
        state: absent

    - name: Supprimer la paire de clés
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
        state: absent
