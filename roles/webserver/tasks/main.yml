---
# tasks file for webserver
- name: Installer nginx
  become: true
  ansible.builtin.dnf:

    name: nginx
    state: present

- name: Publier la page d'accueil
  become: true
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ web_docroot }}/index.html"
    owner: root
    group: root
    mode: "0644"

- name: Ajouter le point de contrôle /health
  become: true
  ansible.builtin.template:
    src: health.conf.j2
    dest: /etc/nginx/default.d/health.conf
    owner: root
    group: root
    mode: "0644"
  notify: Recharger nginx

- name: Démarrer nginx et l'activer au boot
  become: true
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
