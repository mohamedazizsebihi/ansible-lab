- name: Provisionnement de l'infrastructure AWS
  hosts: localhost
  #connexion avec aws api non par ssh
  connection: local
  #ne collecte pas les inutile de ma poste local
  gather_facts: false
  vars_files:
    - vars/aws.yml

  module_defaults:
    group/amazon.aws.aws:
      region: "{{ aws_region }}"
      profile: isoset


  tasks:
    - name: Détecter mon IP publique
      ansible.builtin.uri:
        url: https://api.ipify.org
        return_content: true
      register: my_ip

    - name: Importer la clé publique sur EC2
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
        key_material: "{{ lookup('ansible.builtin.file', ssh_pub_key) }}"
        state: present

    - name: Récupérer le VPC par défaut
      amazon.aws.ec2_vpc_net_info:
        filters:
          is-default: true
      register: vpc_id

    - name: Créer un groupe de sécurité
      amazon.aws.ec2_security_group:
        name: "{{ sg_name }}"
        description: "Security group for ansible-exam ssh et http"
        vpc_id: "{{ vpc_id.vpcs[0].id }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: "{{ my_ip.content | trim }}/32"
          - proto: tcp
            from_port: 80
            to_port: 80
            cidr_ip: 0.0.0.0/0
      register: exam_sg

    - name: Chercher les AMI Amazon Linux 2023 x86_64
      amazon.aws.ec2_ami_info:
        owners:
          - amazon
        filters:
          name: "al2023-ami-2023.*-x86_64"
          architecture: x86_64
          state: available
      register: al2023

    - name: Garder l'AMI la plus récente
      ansible.builtin.set_fact:
        ami_id: "{{ (al2023.images | sort(attribute='creation_date') | last).image_id }}"

    - name: Créer les instances (idempotent grâce au tag Name)
      amazon.aws.ec2_instance:
        name: "{{ item.name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        key_name: "{{ key_name }}"
        security_group: "{{ exam_sg.group_id }}"
        # omit = "ne passe pas ce paramètre" pour web1/web2, qui n'ont pas de volume en plus
        volumes: "{{ item.volumes | default(omit) }}"
        # IMDSv2 obligatoire : bonne pratique de sécurité AWS
        metadata_options:
          http_endpoint: enabled
          http_tokens: required
        tags:
          Role: "{{ item.role }}"
          Project: "{{ project_tag }}"
        state: running
        # On attend l'état "running" avant de passer à la suite
        wait: true
      loop: "{{ instances }}"
      # Affiche seulement le nom dans la sortie, pas tout le dictionnaire
      loop_control:
        label: "{{ item.name }}"
      register: ec2

    # "running" ne veut pas dire "SSH prêt" : on attend la bannière OpenSSH
    - name: Attendre que SSH réponde sur chaque instance
      ansible.builtin.wait_for:
        host: "{{ item.instances[0].public_ip_address }}"
        port: 22
        search_regex: OpenSSH
        timeout: 300
      loop: "{{ ec2.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Résumé
      ansible.builtin.debug:
        msg: "{{ item.item.name }} -> {{ item.instances[0].public_ip_address }}"
      loop: "{{ ec2.results }}"
      loop_control:
        label: "{{ item.item.name }}"
