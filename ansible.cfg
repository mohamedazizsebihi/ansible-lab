[defaults]
inventory=./inventory
remote_user=ec2-user
private_key_file=~/.ssh/isoset-lab.pem
host_key_checking=False
roles_path=./roles
collections_path=./collections
vault_password_file=./.vault-pass
interpreter_python=auto_silent
callback_result_format=yaml

[privilege_escalation]
become=false
become_method=sudo

[inventory]
enable_plugins=amazon.aws.aws_ec2, ini

[ssh_connection]
# Envoie le module dans la session SSH existante : moins d'allers-retours, playbooks plus rapides
pipelining = True





